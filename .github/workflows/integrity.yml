name: Release integrity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - run: node tools/verify-catalog.mjs --self-test
      - run: node tools/verify-catalog.mjs
      - run: node tools/verify-catalog-v2.mjs --self-test
      - run: node tools/verify-catalog-v2.mjs catalog-v2.json catalog-v2.json.sig
      - run: python3 tools/verify-transform-release.py
      - run: node tools/check-manager-source.mjs
      - run: node tools/check-public-tree.mjs

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: sh macos/build.sh
      - name: Package verified macOS manager
        run: |
          mkdir -p macos/dist
          ditto -c -k --sequesterRsrc --keepParent macos/build/MyVibe.app macos/dist/MyVibe-0.5.1-beta.1-macos-universal.zip
          cd macos/dist
          shasum -a 256 MyVibe-0.5.1-beta.1-macos-universal.zip > MyVibe-0.5.1-beta.1-macos-universal.zip.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MyVibe-0.5.1-beta.1-macos-universal
          path: macos/dist/*
          if-no-files-found: error
