name: Windows beta

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/windows-beta.yml"
      - "catalog-v2.json"
      - "catalog-v2.json.sig"
      - "windows/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Build and verify Windows beta
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File windows\build-release.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File windows\test-beta-lifecycle.ps1 -PreviewPath windows\dist\myvibe-windows.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          windows\bin\MyVibe.exe --screenshot windows\dist\myvibe-overview.png 1080 720 com.badru.transform2d5
          windows\bin\MyVibe.exe --screenshot windows\dist\myvibe-tonemesh.png 1080 720 com.badru.tonemesh
          windows\bin\MyVibe.exe --screenshot windows\dist\myvibe-logolize.png 1080 720 com.badru.logolize
          windows\bin\MyVibe.exe --screenshot windows\dist\myvibe-compact.png 760 680 com.badru.tonemesh

      - name: Upload verified manager ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MyVibe-0.5.0-beta.1-win-x64
          path: |
            windows/dist/MyVibe-0.5.0-beta.1-win-x64.zip
            windows/dist/MyVibe-0.5.0-beta.1-win-x64.zip.sha256
            windows/dist/myvibe-windows.png
            windows/dist/myvibe-overview.png
            windows/dist/myvibe-tonemesh.png
            windows/dist/myvibe-logolize.png
            windows/dist/myvibe-compact.png
          if-no-files-found: error
