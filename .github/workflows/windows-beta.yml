name: Windows beta

on:
  workflow_dispatch:
  push:
    branches: [codex/myvibe-windows-v2]
  pull_request:
    paths:
      - ".github/workflows/windows-beta.yml"
      - "catalog-v2.json"
      - "catalog-v2.json.sig"
      - "windows/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Fetch verified 2.5D Transform payload
        shell: powershell
        run: |
          $payload = 'windows\payload\2.5D Transform-0.9.5-beta.zip'
          New-Item -ItemType Directory -Force -Path (Split-Path $payload) | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/badrulmokhtar/myvibe/releases/download/transform2d5-v0.9.5/2.5D-Transform-0.9.5-beta-win-x64.zip' -OutFile $payload
          $expected = '88dfa7099458b53ee7d78006c247f368c7470aaa89fed7a426648faa48932944'
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $payload).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Unexpected 2.5D Transform payload hash: $actual" }

      - name: Build and verify Windows beta
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File windows\build-release.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File windows\test-beta-lifecycle.ps1

      - name: Upload verified manager ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MyVibe-0.4.0-beta.1-win-x64
          path: |
            windows/dist/MyVibe-0.4.0-beta.1-win-x64.zip
            windows/dist/MyVibe-0.4.0-beta.1-win-x64.zip.sha256
          if-no-files-found: error
